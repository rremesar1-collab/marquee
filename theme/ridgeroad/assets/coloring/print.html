<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Coloring Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="pg">@page { size: letter landscape; margin: 0.35in; }</style>
<style>
html, body { margin: 0; background: #fff; }
.bar { font: 16px Arial, sans-serif; text-align: center; padding: 12px; background: #8a1219; color: #fff; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
.bar span { flex-basis: 100%; }
.bar button, .bar a { font: bold 16px Arial, sans-serif; padding: 10px 20px; border: 0; border-radius: 8px; background: #ffd45c; color: #3a1a00; cursor: pointer; text-decoration: none; }
.bar a { background: #fff; color: #8a1219; }
.sheet { position: relative; margin: 0 auto; container-type: inline-size; }
.land .sheet { max-width: 10.5in; }
.port .sheet { max-width: 7.6in; }
.sheet img#pic { display: block; width: 100%; height: auto; }
/* the show's name or logo, printed in the corner where the standard pages leave room */
.tag { position: absolute; display: flex; align-items: center; justify-content: flex-end; text-align: right; color: #111; font: 800 2.5cqw/1.1 "Arial Rounded MT Bold", "Helvetica Rounded", Arial, sans-serif; overflow: hidden; }
.land .tag { left: 71.5%; right: 3%; top: 85%; bottom: 3.2%; }
.port .tag { left: 66%; right: 5%; top: 90.4%; bottom: 2.9%; font-size: 3.3cqw; }
.tag img { max-width: 100%; max-height: 100%; filter: grayscale(1) contrast(1.15); }
.custom .tag { display: none; }
@media print {
	.bar { display: none; }
	.land .sheet { max-width: none; width: 10.2in; }
	.port .sheet { max-width: none; width: 7.48in; }
}
</style></head>
<body>
<div class="bar"><span id="msg">Print this page and grab your crayons!</span> <a id="back" href="javascript:history.back()">&larr; <b id="backtxt">Back to Coloring Pages</b></a> <button type="button" id="print" onclick="window.print()">Print</button></div>
<div class="sheet"><img id="pic" alt=""><div class="tag" id="tag"></div></div>
<script>
(function () {
	var PAGES = {
		'snowman': ['Happy Holidays snowman', 'land'],
		'reindeer': ['Little reindeer', 'land'],
		'gingerbread': ['Gingerbread friend', 'land'],
		'merry-christmas': ['Merry Christmas snowmen', 'land'],
		'santa-tree': ['Santa and the Christmas tree', 'port'],
		'santa-cookies': ['Santa baking cookies', 'port']
	};
	var q = new URLSearchParams(location.search);
	// only pictures from this website
	var same = function (u) { try { return new URL(u, location.href).origin === location.origin; } catch (e) { return false; } };
	// the visitor's language
	var T = {
		es: ['¡Imprime esta página y saca tus crayones!', 'Imprimir', 'Volver a los dibujos para colorear'],
		fr: ['Imprimez cette page et sortez vos crayons !', 'Imprimer', 'Retour aux coloriages']
	}[(q.get('hl') || '').slice(0, 2)];
	if (T) {
		document.documentElement.lang = q.get('hl').slice(0, 2);
		document.getElementById('msg').textContent = T[0]; document.getElementById('print').textContent = T[1]; document.getElementById('backtxt').textContent = T[2];
	}
	// back to the coloring pages (the page it came from, or the address the website gave)
	var back = document.getElementById('back'), b = q.get('b') || '';
	back.addEventListener('click', function (e) {
		e.preventDefault();
		if (document.referrer && same(document.referrer) && history.length > 1) { history.back(); return; }
		location.href = (b && same(b)) ? b : '/';
	});
	var name = (q.get('n') || '').slice(0, 60), logo = q.get('l') || '', custom = q.get('img') || '';
	var key = PAGES[q.get('p')] ? q.get('p') : 'snowman', title, orient, src;
	if (custom && same(custom)) {
		title = (q.get('t') || 'Coloring page').slice(0, 80); orient = q.get('o') === 'port' ? 'port' : 'land'; src = custom;
		document.body.classList.add('custom'); // a show's own page: it already has whatever it needs printed on it
	} else {
		title = PAGES[key][0]; orient = PAGES[key][1]; src = key + '.png?v=' + ((q.get('v') || '1').replace(/[^\w.]/g, ''));
	}
	document.body.classList.add(orient);
	document.getElementById('pg').textContent = '@page { size: letter ' + (orient === 'port' ? 'portrait' : 'landscape') + '; margin: 0.35in; }';
	document.title = 'Coloring Page: ' + title + (name ? ' – ' + name : '');
	var tag = document.getElementById('tag');
	if (logo && same(logo)) {
		var li = document.createElement('img'); li.alt = name; li.src = logo; tag.appendChild(li);
	} else if (name) {
		tag.textContent = name;
	}
	var img = document.getElementById('pic');
	img.alt = 'Coloring page: ' + title;
	img.src = src; // printing starts when the visitor taps Print (they can go back instead)
})();
</script>
</body></html>
